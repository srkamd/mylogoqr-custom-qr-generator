<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyLogoQR Studio</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <img src="icons/icon32.png" alt="MyLogoQR" class="brand-icon">
        <div class="brand-text">
          <span class="brand-name">MyLogoQR</span>
          <span class="brand-badge">STUDIO</span>
        </div>
      </div>
      <a href="https://mylogoqr.com/?utm_source=chrome_extension&utm_medium=header_link" target="_blank" class="studio-link" title="Open Full 22+ Tools Studio">
        <span>Full Web App</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
      </a>
    </header>

    <!-- Tabs -->
    <nav class="nav-tabs">
      <button class="tab-btn active" data-tab="url">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
        URL
      </button>
      <button class="tab-btn" data-tab="text">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
        Text
      </button>
      <button class="tab-btn" data-tab="wifi">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
        Wi-Fi
      </button>
      <button class="tab-btn" data-tab="whatsapp">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
        WhatsApp
      </button>
      <button class="tab-btn" data-tab="vcard">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        vCard
      </button>
    </nav>

    <!-- Content Input Panels -->
    <div class="input-panels">
      <!-- URL Panel -->
      <div class="panel active" id="panel-url">
        <div class="input-group">
          <input type="text" id="url-input" placeholder="https://example.com" class="main-input">
          <button id="btn-current-tab" class="secondary-btn" title="Grab active tab URL">Current Tab</button>
        </div>
      </div>

      <!-- Text Panel -->
      <div class="panel" id="panel-text">
        <textarea id="text-input" placeholder="Type or paste any note, message, or text..." class="main-textarea" rows="2"></textarea>
      </div>

      <!-- Wi-Fi Panel -->
      <div class="panel" id="panel-wifi">
        <div class="form-row">
          <input type="text" id="wifi-ssid" placeholder="Network Name (SSID)" class="main-input">
          <select id="wifi-enc" class="main-select">
            <option value="WPA">WPA/WPA2</option>
            <option value="WEP">WEP</option>
            <option value="nopass">None</option>
          </select>
        </div>
        <input type="password" id="wifi-pass" placeholder="Password" class="main-input mt-2">
      </div>

      <!-- WhatsApp Panel -->
      <div class="panel" id="panel-whatsapp">
        <input type="tel" id="wa-phone" placeholder="Phone Number with country code (e.g. 15551234567)" class="main-input">
        <input type="text" id="wa-msg" placeholder="Pre-filled greeting message..." class="main-input mt-2">
      </div>

      <!-- vCard Panel -->
      <div class="panel" id="panel-vcard">
        <div class="form-row">
          <input type="text" id="vcard-fn" placeholder="Full Name" class="main-input">
          <input type="tel" id="vcard-tel" placeholder="Phone" class="main-input">
        </div>
        <input type="email" id="vcard-email" placeholder="Email address" class="main-input mt-2">
      </div>
    </div>

    <!-- QR Code Preview Area -->
    <div class="preview-wrapper">
      <div class="qr-card">
        <div id="qr-container"></div>
      </div>
    </div>

    <!-- Customization Options Bar -->
    <div class="controls-section">
      <div class="control-row">
        <!-- Color Presets -->
        <div class="color-picker-group">
          <label>Color</label>
          <div class="color-swatches">
            <button class="swatch active" data-color="#0f172a" style="background:#0f172a" title="Midnight Black"></button>
            <button class="swatch" data-color="#2563eb" style="background:#2563eb" title="Indigo Blue"></button>
            <button class="swatch" data-color="#7c3aed" style="background:#7c3aed" title="Royal Purple"></button>
            <button class="swatch" data-color="#059669" style="background:#059669" title="Emerald Green"></button>
            <button class="swatch" data-color="#dc2626" style="background:#dc2626" title="Crimson Red"></button>
            <input type="color" id="custom-color-picker" value="#0f172a" class="custom-color-input" title="Custom Color">
          </div>
        </div>

        <!-- Dot Style -->
        <div class="dot-style-group">
          <label>Shape</label>
          <select id="dot-style-select" class="style-select">
            <option value="rounded">Rounded</option>
            <option value="dots">Dots</option>
            <option value="classy">Classy</option>
            <option value="square">Classic</option>
          </select>
        </div>
      </div>

      <!-- Center Logo & Error Correction -->
      <div class="control-row mt-2">
        <label class="checkbox-label">
          <input type="checkbox" id="center-logo-toggle" checked>
          <span>Embed Center Icon</span>
        </label>
        <div class="custom-logo-upload">
          <label for="custom-logo-input" class="upload-btn" title="Upload custom center logo">Upload Logo</label>
          <input type="file" id="custom-logo-input" accept="image/*" style="display:none">
        </div>
      </div>
    </div>

    <!-- Export Action Buttons -->
    <div class="action-buttons">
      <button id="btn-download-png" class="action-btn primary" title="Download High Resolution PNG">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        PNG
      </button>
      <button id="btn-download-svg" class="action-btn secondary" title="Download Vector SVG for Print">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        SVG (Vector)
      </button>
      <button id="btn-copy-clip" class="action-btn secondary" title="Copy QR to Clipboard">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        Copy
      </button>
    </div>

    <!-- Feedback Notification -->
    <div id="toast-msg" class="toast">Copied to clipboard!</div>

    <!-- Footer -->
    <footer class="app-footer">
      <span>100% Client-Side Privacy • </span>
      <a href="https://mylogoqr.com/?utm_source=chrome_extension&utm_medium=footer_attribution" target="_blank">mylogoqr.com</a>
    </footer>
  </div>

  <script src="libs/qr-code-styling.js"></script>
  <script src="popup.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C1B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#080C1B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#080C1B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Geometric Abstract Visual Element on Right -->
  <g transform="translate(860, 315)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="190" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="10 14"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-opacity="0.6"/>
    <circle cx="0" cy="0" r="95" fill="rgba(15,23,42,0.85)" stroke="url(#accentGrad)" stroke-width="4"/>
    
    <!-- Central Tech Icon Badge -->
    <rect x="-42" y="-42" width="84" height="84" rx="20" fill="url(#accentGrad)"/>
    <rect x="-30" y="-30" width="60" height="60" rx="14" fill="#0F172A"/>
    <!-- Central Microchip / QR Nodes -->
    <rect x="-18" y="-18" width="14" height="14" rx="3" fill="url(#accentGrad)"/>
    <rect x="4" y="-18" width="14" height="14" rx="3" fill="url(#accentGrad)"/>
    <rect x="-18" y="4" width="14" height="14" rx="3" fill="url(#accentGrad)"/>
    <rect x="4" y="4" width="14" height="14" rx="3" fill="#FFFFFF"/>
    
    <!-- Satellites -->
    <circle cx="120" cy="-60" r="10" fill="#7C3AED"/>
    <circle cx="-130" cy="50" r="8" fill="#DC2626"/>
    <circle cx="40" cy="130" r="6" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Left Content Box -->
  <g transform="translate(80, 110)">
    <!-- Brand Tag -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="170" height="34" rx="17" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
      <text x="20" y="22" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0" letter-spacing="1">MYLOGOQR HUB</text>
    </g>

    <!-- Category Pill -->
    <g transform="translate(185, 0)">
      <rect x="0" y="0" width="180" height="34" rx="17" fill="url(#accentGrad)"/>
      <text x="22" y="22" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">CYBERSECURITY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="115" font-family="'Bricolage Grotesque', 'Inter', sans-serif" font-size="46" font-weight="800" fill="#FFFFFF" width="680" letter-spacing="-1">
      Deepfakes, Voice Cloning &amp; AI Identity Theft
    </text>
    <text x="0" y="175" font-family="'Bricolage Grotesque', 'Inter', sans-serif" font-size="46" font-weight="800" fill="#FFFFFF" width="680" letter-spacing="-1">
      
    </text>

    <!-- Subtitle / Meta Description -->
    <text x="0" y="245" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94A3B8">
      Navigating Biometric Spoofing, Watermarking Standards &amp; Cyber Def
    </text>
    <text x="0" y="278" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94A3B8">
      ense Protocols
    </text>

    <!-- Footer Meta Stats -->
    <g transform="translate(0, 360)">
      <rect x="0" y="0" width="480" height="2" fill="rgba(255,255,255,0.1)"/>
      <text x="0" y="32" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="600" fill="#CBD5E1">
        VERIFIED GUIDE  &#8226;  FREE TOOLS  &#8226;  100% PRIVATE CLIENT-SIDE
      </text>
    </g>
  </g>
</svg>